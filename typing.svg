<svg xmlns="http://www.w3.org/2000/svg" width="900" height="50" viewBox="0 0 900 50" role="img" aria-label="8+ apps live on App Store and Google Play. BLE, GPS, IoT, AI-powered mobile apps. Redux, Socket.io, Firebase, Fastlane.">
  <style>
    text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 22px; font-weight: 600; fill: #00E5FF; text-anchor: middle; }
  </style>

  <text x="450" y="32" opacity="1">8+ apps live on App Store and Google Play
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.23;0.25;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="32" opacity="0">BLE | GPS | IoT | AI-powered mobile apps
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="32" opacity="0">35% faster apps with Hermes and performance tuning
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="32" opacity="0">Redux | Socket.io | Firebase | Fastlane
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.77;1" dur="12s" repeatCount="indefinite"/>
  </text>
</svg>

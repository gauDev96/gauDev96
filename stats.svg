<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Career impact: about 4 years experience, 8+ live apps, 35% performance gain, 95% on-time sprints. Languages: JavaScript 54%, TypeScript 25%, CSS 16%.">
  <defs>
    <clipPath id="langclip">
      <rect x="20" y="202" width="0" height="14" rx="7">
        <animate attributeName="width" from="0" to="860" dur="1.6s" begin="1s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .big  { font-size: 40px; font-weight: 700; }
    .lbl  { font-size: 11px; fill: #c9d1d9; letter-spacing: 1px; }
    .sub  { font-size: 11px; fill: #8b949e; }
    .leg  { font-size: 12px; fill: #c9d1d9; }
  </style>

  <rect x="1" y="1" width="898" height="288" rx="12" fill="#0d1117" stroke="#30363d"/>

  <text x="20" y="28" class="mono" font-size="14" fill="#7ee787">$ <tspan fill="#c9d1d9">./impact --career</tspan></text>

  <!-- Tile 1: experience -->
  <g transform="translate(20,44)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
    <rect width="200" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="66" text-anchor="middle" class="mono big" fill="#00E5FF">~4</text>
    <text x="100" y="98" text-anchor="middle" class="mono lbl">YEARS EXPERIENCE</text>
    <text x="100" y="112" text-anchor="middle" class="mono sub">React Native</text>
  </g>

  <!-- Tile 2: live apps -->
  <g transform="translate(240,44)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.4s" fill="freeze"/>
    <rect width="200" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="66" text-anchor="middle" class="mono big" fill="#7ee787">8+</text>
    <text x="100" y="98" text-anchor="middle" class="mono lbl">LIVE APPS</text>
    <text x="100" y="112" text-anchor="middle" class="mono sub">App Store &amp; Google Play</text>
  </g>

  <!-- Tile 3: performance ring -->
  <g transform="translate(460,44)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
    <rect width="200" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="100" cy="46" r="30" fill="none" stroke="#21262d" stroke-width="7"/>
    <circle cx="100" cy="46" r="30" fill="none" stroke="#F5A623" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90 100 46)">
      <animate attributeName="stroke-dashoffset" from="188.5" to="122.5" dur="1.5s" begin="0.9s" fill="freeze"/>
    </circle>
    <text x="100" y="52" text-anchor="middle" class="mono" font-size="18" font-weight="700" fill="#F5A623">35%</text>
    <text x="100" y="98" text-anchor="middle" class="mono lbl">PERFORMANCE GAIN</text>
    <text x="100" y="112" text-anchor="middle" class="mono sub">Hermes &amp; rendering</text>
  </g>

  <!-- Tile 4: on-time ring -->
  <g transform="translate(680,44)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.8s" fill="freeze"/>
    <rect width="200" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="100" cy="46" r="30" fill="none" stroke="#21262d" stroke-width="7"/>
    <circle cx="100" cy="46" r="30" fill="none" stroke="#79c0ff" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90 100 46)">
      <animate attributeName="stroke-dashoffset" from="188.5" to="9.4" dur="1.5s" begin="1.1s" fill="freeze"/>
    </circle>
    <text x="100" y="52" text-anchor="middle" class="mono" font-size="18" font-weight="700" fill="#79c0ff">95%</text>
    <text x="100" y="98" text-anchor="middle" class="mono lbl">ON-TIME SPRINTS</text>
    <text x="100" y="112" text-anchor="middle" class="mono sub">Project delivery</text>
  </g>

  <!-- Languages -->
  <text x="20" y="190" class="mono" font-size="14" fill="#7ee787">$ <tspan fill="#c9d1d9">cat languages.txt</tspan></text>

  <rect x="20" y="202" width="860" height="14" rx="7" fill="#161b22"/>
  <g clip-path="url(#langclip)">
    <rect x="20"    y="202" width="468.2" height="14" fill="#f1e05a"/>
    <rect x="488.2" y="202" width="215.3" height="14" fill="#3178c6"/>
    <rect x="703.5" y="202" width="133.4" height="14" fill="#563d7c"/>
    <rect x="836.9" y="202" width="22.7"  height="14" fill="#b07219"/>
    <rect x="859.6" y="202" width="10.6"  height="14" fill="#f34b7d"/>
    <rect x="870.2" y="202" width="9.8"   height="14" fill="#a91e50"/>
  </g>

  <circle cx="26"  cy="240" r="5" fill="#f1e05a"/><text x="38"  y="244" class="mono leg">JavaScript 54.44%</text>
  <circle cx="176" cy="240" r="5" fill="#3178c6"/><text x="188" y="244" class="mono leg">TypeScript 25.03%</text>
  <circle cx="336" cy="240" r="5" fill="#563d7c"/><text x="348" y="244" class="mono leg">CSS 15.51%</text>
  <circle cx="446" cy="240" r="5" fill="#b07219"/><text x="458" y="244" class="mono leg">Java 2.64%</text>
  <circle cx="556" cy="240" r="5" fill="#f34b7d"/><text x="568" y="244" class="mono leg">C++ 1.23%</text>
  <circle cx="656" cy="240" r="5" fill="#a91e50"/><text x="668" y="244" class="mono leg">EJS 1.16%</text>

  <text x="20" y="274" class="mono sub"># language split across public repos</text>
</svg>

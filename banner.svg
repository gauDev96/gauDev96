  </defs>
  <rect width="1000" height="200" rx="16" fill="url(#bg)"/>
  <text x="500" y="95" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#ffffff">Gaurab Mukherjee

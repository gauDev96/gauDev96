<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-label="Side projects: Wearit Shopping Ecommerce App, Quick chat app, push notification, navTechPro shoe cart app.">
  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>

  <!-- Card 1 -->
  <g transform="translate(10,10)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
    <rect width="430" height="135" rx="10" fill="#0d1117" stroke="#30363d"/>
    <path d="M0 28 V10 a10 10 0 0 1 10 -10 H420 a10 10 0 0 1 10 10 V28 Z" fill="#161b22"/>
    <circle cx="16" cy="14" r="4" fill="#ff5f56"/><circle cx="30" cy="14" r="4" fill="#ffbd2e"/><circle cx="44" cy="14" r="4" fill="#27c93f"/>
    <text x="414" y="18" text-anchor="end" class="mono" font-size="11" fill="#8b949e">~/side-projects</text>
    <text x="18" y="58" class="mono" font-size="17" font-weight="700"><tspan fill="#7ee787">$ </tspan><tspan fill="#00E5FF">Wearit-Shopping-Ecommerce-App</tspan></text>
    <text x="18" y="82" class="sans" font-size="13" fill="#c9d1d9">Shopping e-commerce app built with JavaScript</text>
    <rect x="18" y="98" width="86" height="22" rx="11" fill="#1f2937" stroke="#30363d"/>
    <text x="61" y="113" text-anchor="middle" class="mono" font-size="11" fill="#f1e05a">JavaScript</text>
    <rect x="112" y="98" width="86" height="22" rx="11" fill="#1f2937" stroke="#30363d"/>
    <text x="155" y="113" text-anchor="middle" class="mono" font-size="11" fill="#79c0ff">E-commerce</text>
  </g>

